<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User</title>
</head>

<body>
    <h1>Create User</h1>
    <form th:action="@{/users}" th:object="${user}" method="post" enctype="multipart/form-data">
        <!-- Dropdown for selecting department -->
        <label for="department">Department:</label>
        <select id="department" th:field="*{department.id}" required>
            <option value="">Select a department</option>
            <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
        </select><br><br>

        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" th:field="*{firstName}" required><br><br>

        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" th:field="*{lastName}" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" th:field="*{password}" required><br><br>

        <label for="image">Profile Image:</label>
        <input type="file" id="image" name="image" accept="image/*"><br><br>
        <button type="submit">Save</button>
    </form>
</body>

</html>
