<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>
</head>

<body>
    <h1>Edit User</h1>
    <form th:action="@{/users/update/{id}(id=${user.id})}" th:object="${user}" method="post"
        enctype="multipart/form-data">

        <label for="department">Department:</label>
        <select id="department" th:field="*{department.id}" required>
            <option value="">Select a department</option>
            <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
        </select><br><br>

        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" th:field="*{firstName}" required><br><br>

        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" th:field="*{lastName}" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}" required><br><br>

        <label for="password">New Password (leave blank to keep current):</label>
        <input type="password" id="password" th:field="*{password}"><br><br>

        <!-- current image preview -->
        <div th:if="${user.imageUrl != null}">
            <img th:src="@{${user.imageUrl}}" alt="Current image" width="80" height="80"><br><br>
        </div>

        <label for="image">Profile Image (leave empty to keep current):</label>
        <input type="file" id="image" name="image" accept="image/*"><br><br>

        <button type="submit">Update</button>
        <a th:href="@{/users}">Cancel</a>
    </form>
</body>

</html>
